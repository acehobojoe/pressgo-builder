name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax-and-hardening:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: PHP syntax
        run: find . -path './node_modules' -prune -o -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find assets test -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Shell syntax
        run: bash -n build-zip.sh
      - name: PHP hardening tests
        run: php test/unit/hardening.php
      - name: Repository tests
        run: npm test
